    <rect x="240" y="240" width="32" height="136" rx="6" fill="#d97706" />
    <rect x="312" y="240" width="32" height="136" rx="6" fill="#d97706" />
    <!-- Base step -->
    <rect x="112" y="396" width="288" height="24" rx="4" fill="#78350f" />
    <!-- Golden Seal -->
    <circle cx="256" cy="180" r="22" fill="#d97706" />
